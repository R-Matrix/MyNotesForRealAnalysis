name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode

      - name: Prepare PDF files
        run: |
          DATE=$(date +'%Y-%m-%d')
          cp main.pdf "实变函数笔记-latest.pdf"
          cp main.pdf "实变函数笔记-${DATE}.pdf"

      - name: Deploy latest PDF to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          only: "实变函数笔记-latest.pdf"

      - name: Create Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "实变函数笔记-*.pdf"
          tag_name: ${{ github.ref_name }}
          name: "实变函数笔记 ${{ github.ref_name }}"