name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode

      - name: Prepare deployment files
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p deploy
          
          # 复制 PDF
          cp main.pdf "deploy/实变函数笔记-latest.pdf"
          cp main.pdf "deploy/实变函数笔记-${DATE}.pdf"
          
          # 复制 PDF.js
          cp -r web/pdfjs deploy/
          
          # 创建入口页面
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=pdfjs/web/viewer.html?file=../实变函数笔记-latest.pdf">
              <title>实变函数笔记</title>
          </head>
          <body>
              <p>正在加载...</p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "实变函数笔记-*.pdf"
          tag_name: ${{ github.ref_name }}
          name: "实变函数笔记 ${{ github.ref_name }}"